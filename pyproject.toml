[project]
name = "psxdata-mcp"
version = "0.1.1"
description = "MCP server for Pakistan Stock Exchange data: load PSX data into a local DuckDB and query it with SQL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "psxdata>=1.1,<2",
    "duckdb>=1.5,<2",
    "anyio>=4",
]

[project.scripts]
psxdata-mcp = "psxdata_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psxdata_mcp"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pandas-stubs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits the real PSX website (opt-in: -m live)",
    "container: needs the Docker image built (opt-in: -m container)",
]
addopts = "-m 'not live and not container'"
