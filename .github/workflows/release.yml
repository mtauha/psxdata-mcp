name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package, plugin and bundle versions
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          plugin=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          bundle=$(python3 -c "import json;print(json.load(open('mcpb/manifest.json'))['version'])")
          echo "tag=$VERSION pyproject=$py plugin=$plugin bundle=$bundle"
          test "$VERSION" = "$py"
          test "$VERSION" = "$plugin"
          test "$VERSION" = "$bundle"

      - uses: astral-sh/setup-uv@v6

      - name: Build and smoke-test the Claude Desktop bundle
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          uv sync --locked
          uv run python scripts/stage_mcpb.py build/mcpb
          npx -y @anthropic-ai/mcpb@2.1.2 validate build/mcpb/manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack build/mcpb "build/psxdata-mcp-$VERSION.mcpb"
          PSXDATA_MCP_BUNDLE="build/psxdata-mcp-$VERSION.mcpb" uv run pytest -m bundle -v

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mtauha/psxdata-mcp:${{ steps.v.outputs.version }}
            mtauha/psxdata-mcp:latest

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        # A release drafted in the GitHub UI creates the tag first; attach the bundle to it then.
        run: |
          bundle="build/psxdata-mcp-$VERSION.mcpb"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$bundle" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes "$bundle"
          fi
