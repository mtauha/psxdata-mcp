name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package and plugin versions
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          py=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          plugin=$(python3 -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          echo "tag=$VERSION pyproject=$py plugin=$plugin"
          test "$VERSION" = "$py"
          test "$VERSION" = "$plugin"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mtauha/psxdata-mcp:${{ steps.v.outputs.version }}
            mtauha/psxdata-mcp:latest

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
